name: Linux CPU rendering verification

on:
  workflow_dispatch:
  push:
    branches: [codex/linux-cpu-rendering]

permissions:
  contents: read
  actions: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: neovide-linux-x86_64-glibc-2.28
          run-id: 37772327548
          github-token: ${{ github.token }}
          path: target/cpu-rendering/package
      - name: Render with CPU on glibc 2.28 without a GPU
        run: |
          docker run --rm -v "$PWD:/work" -w /work almalinux:8 bash -ec '
            yum install -y epel-release
            yum install -y xorg-x11-server-Xvfb xorg-x11-utils mesa-dri-drivers \
              mesa-libGL mesa-libEGL glx-utils dejavu-sans-mono-fonts ImageMagick \
              git gcc-toolset-14-gcc gcc-toolset-14-gcc-c++ make unzip \
              python39 python39-pip
            export PATH="/opt/rh/gcc-toolset-14/root/usr/bin:$PATH"
            python3.9 -m pip install "cmake>=3.16,<4" ninja
            git clone --depth 1 --branch v0.11.5 https://github.com/neovim/neovim.git target/cpu-rendering/neovim
            make -C target/cpu-rendering/neovim CMAKE_BUILD_TYPE=Release \
              CMAKE_EXTRA_FLAGS="-DENABLE_LIBINTL=OFF" -j2
            bash ubuntu-builder/verify-cpu-rendering.sh
          '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-cpu-rendering-evidence
          path: target/cpu-rendering/evidence
          if-no-files-found: warn
